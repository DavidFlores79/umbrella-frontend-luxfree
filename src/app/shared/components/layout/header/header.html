<header class="bg-white dark:bg-background-dark-secondary border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50">
  <div class="px-4 sm:px-6 py-4">
    <div class="flex items-center justify-between">
      <!-- Left: Mobile Menu Button + Logo -->
      <div class="flex items-center gap-3 sm:gap-4">
        <!-- Hamburger Menu Button (Mobile Only) -->
        <button
          (click)="onMenuToggle()"
          class="lg:hidden p-2 rounded-lg text-text dark:text-text-dark-DEFAULT hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          type="button"
          aria-label="Toggle menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>

        <h1 class="text-lg sm:text-xl font-bold text-primary dark:text-primary-400">Umbrella</h1>
      </div>

      <!-- Right: User Menu -->
      <div class="relative">
        @if (user$ | async; as user) {
          <!-- User Menu Button -->
          <button
            (click)="toggleUserMenu()"
            class="flex items-center gap-2 sm:gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
            type="button"
            aria-label="User menu"
            [attr.aria-expanded]="isUserMenuOpen()"
            aria-haspopup="true">
            <!-- User Avatar -->
            <div class="w-8 h-8 rounded-full bg-primary dark:bg-primary-400 flex items-center justify-center text-white font-semibold text-sm">
              {{ getInitials($any(user).firstName, $any(user).lastName) }}
            </div>
            <!-- User Name (hidden on mobile) -->
            <span class="text-sm text-text dark:text-text-dark-DEFAULT font-medium hidden sm:inline">
              {{ $any(user).firstName }} {{ $any(user).lastName }}
            </span>
            <!-- Dropdown Icon -->
            <svg class="w-4 h-4 text-text-light dark:text-text-dark-light transition-transform" [class.rotate-180]="isUserMenuOpen()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          @if (isUserMenuOpen()) {
            <div class="absolute right-0 mt-2 w-56 bg-white dark:bg-background-dark-secondary rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 py-1 z-50">
              <!-- User Info -->
              <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700">
                <p class="text-sm font-medium text-text dark:text-text-dark-DEFAULT">
                  {{ $any(user).firstName }} {{ $any(user).lastName }}
                </p>
                <p class="text-xs text-text-light dark:text-text-dark-light mt-0.5">
                  {{ $any(user).email }}
                </p>
                <p class="text-xs text-text-lighter dark:text-text-dark-lighter mt-1 uppercase font-semibold">
                  {{ $any(user).role }}
                </p>
              </div>

              <!-- Menu Items -->
              <div class="py-1">
                <!-- Profile (future feature) -->
                <button
                  type="button"
                  disabled
                  class="w-full text-left px-4 py-2 text-sm text-text-lighter dark:text-text-dark-lighter cursor-not-allowed flex items-center gap-3">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                  </svg>
                  Profile (Coming Soon)
                </button>

                <!-- Settings (future feature) -->
                <button
                  type="button"
                  disabled
                  class="w-full text-left px-4 py-2 text-sm text-text-lighter dark:text-text-dark-lighter cursor-not-allowed flex items-center gap-3">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  </svg>
                  Settings (Coming Soon)
                </button>
              </div>

              <!-- Logout -->
              <div class="border-t border-gray-200 dark:border-gray-700 py-1">
                <button
                  (click)="onLogout()"
                  type="button"
                  class="w-full text-left px-4 py-2 text-sm text-accent-red hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors flex items-center gap-3">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                  </svg>
                  Logout
                </button>
              </div>
            </div>
          }
        }
      </div>
    </div>
  </div>
</header>
