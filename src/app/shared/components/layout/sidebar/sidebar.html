<aside
  [class]="isCollapsed()
    ? 'w-16 bg-white dark:bg-background-dark-secondary border-r border-gray-200 dark:border-gray-700 min-h-screen transition-all duration-300'
    : 'w-64 bg-white dark:bg-background-dark-secondary border-r border-gray-200 dark:border-gray-700 min-h-screen transition-all duration-300'
  ">
  <!-- Toggle Button -->
  <div class="p-4 border-b border-gray-200 dark:border-gray-700">
    <button
      (click)="toggleSidebar()"
      class="w-full flex items-center justify-center p-2 rounded-lg text-text dark:text-text-dark-DEFAULT hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
      [title]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        @if (isCollapsed()) {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
        }
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="p-4 space-y-2">
    @for (item of menuItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-primary-100 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400"
        (click)="onLinkClick()"
        [class]="isCollapsed()
          ? 'flex items-center justify-center px-2 py-3 rounded-lg text-text dark:text-text-dark-DEFAULT hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors'
          : 'flex items-center gap-3 px-4 py-3 rounded-lg text-text dark:text-text-dark-DEFAULT hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors'"
        [title]="isCollapsed() ? item.label : ''">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
        </svg>
        @if (!isCollapsed()) {
          <span class="font-medium">{{ item.label }}</span>
        }
      </a>
    }
  </nav>
</aside>
