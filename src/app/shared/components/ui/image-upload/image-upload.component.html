<div class="image-upload-container">
  <!-- Label -->
  @if (label) {
    <label class="block text-sm font-medium text-gray-700 mb-2">
      {{ label }}
      <span class="text-gray-500 text-xs ml-1">(Max {{ maxFiles }} files, {{ formatMaxSize() }} each)</span>
    </label>
  }

  <!-- Dropzone -->
  <div
    class="dropzone"
    [class.dragging]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="fileInput.click()"
  >
    <input
      #fileInput
      type="file"
      [accept]="accept"
      [multiple]="maxFiles > 1"
      (change)="onFileInputChange($event)"
      class="hidden-file-input"
    />

    <div class="dropzone-content">
      <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <p class="mt-2 text-sm text-gray-600">
        <span class="font-semibold">Click to upload</span> or drag and drop
      </p>
      <p class="text-xs text-gray-500">PNG, JPG, WEBP up to {{ formatMaxSize() }}</p>
    </div>
  </div>

  <!-- Image Preview Grid -->
  @if (showPreview && images.length > 0) {
    <div class="image-preview-grid mt-4">
      @for (image of images; track image; let i = $index) {
        <div class="image-preview-item">
          <img [src]="image" [alt]="'Image ' + (i + 1)" class="preview-image" />
          <button
            type="button"
            (click)="removeImage(i); $event.stopPropagation()"
            class="remove-button"
            aria-label="Remove image"
          >
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      }
    </div>
  }

  <!-- Image Count -->
  @if (images.length > 0) {
    <p class="text-sm text-gray-600 mt-2">
      {{ images.length }} / {{ maxFiles }} images uploaded
    </p>
  }
</div>
